<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario y Control</title>
  <style>
    :root {
      --cyan: #46e0da;
      --yellow: #ffd700;
      --muted: #8a99ad;
      --line: #1f2947;
    }
    body { background: #0b1024; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    .card { background: #121936; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .hidden { display: none; }
    .btn { background: #1f2947; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }
    .btn.cyan { background: var(--cyan); color: #0b1024; }
    .input { width: 100%; padding: 10px; background: #0d132d; border: 1px solid var(--line); color: #fff; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .platform-item { background: #0d132d; border: 1px solid var(--line); border-radius: 10px; padding: 15px; text-align: center; }
  </style>
</head>
<body>

<div id="app">
  <!-- El contenido se renderiza dinámicamente -->
</div>

<!-- MODAL DE ACCESO ADMIN (La tuerquita) -->
<div id="adminModal" class="card hidden" style="max-width: 350px; margin: auto; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; border: 2px solid var(--cyan);">
  <h3>⚙️ Acceso Administrador</h3>
  <input type="email" id="adminEmail" class="input" placeholder="Correo Admin">
  <input type="password" id="adminPassword" class="input" placeholder="Contraseña">
  <button class="btn cyan" onclick="loginAdmin()">Entrar al Panel</button>
  <button class="btn" style="margin-top: 8px;" onclick="closeAdminModal()">Cancelar</button>
</div>

<script>
  let state = { user: null, isAdmin: false, platforms: [], users: [], settings: {} };

  async function loadData() {
    try {
      const res = await fetch('/api/state');
      state = await res.json();
    } catch (e) {
      // Datos por defecto si está corriendo estático
      state.platforms = [
        { slot: 1, name: 'App 1', logo_url: '🎮', link: 'https://ejemplo1.com', active: true },
        { slot: 2, name: 'App 2', logo_url: '🚀', link: 'https://ejemplo2.com', active: true },
        { slot: 3, name: 'App 3', logo_url: '💎', link: 'https://ejemplo3.com', active: true },
        { slot: 4, name: 'App 4', logo_url: '🔥', link: 'https://ejemplo4.com', active: true },
        { slot: 5, name: 'App 5', logo_url: '⭐', link: 'https://ejemplo5.com', active: true }
      ];
    }
    render();
  }

  function render() {
    if (state.isAdmin) {
      renderAdmin();
    } else {
      renderUser();
    }
  }

  function renderUser() {
    document.getElementById('app').innerHTML = `
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>Panel de Usuario 🎮</h2>
          <p style="color: var(--muted); font-size: 13px; margin: 0;">Selecciona una plataforma para continuar.</p>
        </div>
        <!-- Botón de la tuerquita para entrar al panel de admin -->
        <button class="btn" style="width: auto; padding: 8px 12px; font-size: 18px;" onclick="openAdminModal()" title="Admin">⚙️</button>
      </div>

      <!-- PLATAFORMAS / NIVELES (Solo URLs) -->
      <div class="card">
        <h3>Plataformas Disponibles</h3>
        <div class="grid" style="margin-top: 15px;">
          ${state.platforms.length === 0 ? '<p style="color: var(--muted);">No hay plataformas activas.</p>' :
            state.platforms.map(p => `
              <div class="platform-item">
                <div style="font-size: 26px; margin-bottom: 8px;">${p.logo_url || '🎮'}</div>
                <strong>${p.name}</strong>
                <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="window.open('${p.link}', '_blank')">Abrir Enlace</button>
              </div>
            `).join('')}
        </div>
      </div>
    `;
  }

  function renderAdmin() {
    document.getElementById('app').innerHTML = `
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Panel de Control Admin Pro ⚙️</h2>
          <button class="btn" style="width: auto;" onclick="logout()">Cerrar Sesión</button>
        </div>
        <p style="color: var(--muted); font-size: 13px; margin-top: 5px;">Controla tus plataformas y URLs.</p>
      </div>

      <!-- GESTIÓN DE LAS 5 PLATAFORMAS -->
      <div class="card">
        <h3>Gestionar 5 Plataformas Dinámicas</h3>
        ${state.platforms.map(p => `
          <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #0d132d; padding: 8px; border-radius: 10px; flex-wrap: wrap;">
            <span style="font-weight: bold; color: var(--cyan);">#${p.slot}</span>
            <input type="text" id="p_name_${p.slot}" class="input" value="${p.name}" placeholder="Nombre" style="flex:1; margin:0; min-width: 100px;">
            <input type="text" id="p_logo_${p.slot}" class="input" value="${p.logo_url}" placeholder="Emoji" style="width: 60px; margin:0;">
            <input type="text" id="p_link_${p.slot}" class="input" value="${p.link}" placeholder="URL" style="flex:2; margin:0; min-width: 120px;">
            <button class="btn cyan" style="width: auto; padding: 6px 10px;" onclick="savePlatform(${p.slot})">Guardar</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function savePlatform(slot) {
    const name = document.getElementById(`p_name_${slot}`).value;
    const logo_url = document.getElementById(`p_logo_${slot}`).value;
    const link = document.getElementById(`p_link_${slot}`).value;

    const res = await fetch(`/api/admin/platform/${slot}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, logo_url, link, active: true })
    }).catch(() => ({ ok: true }));

    if ((await res.json)?.ok !== false) {
      alert('Plataforma guardada.');
      loadData();
    }
  }

  function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
  function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

  async function loginAdmin() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
   
    const res = await fetch('/api/auth/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    }).catch(() => ({ ok: true })); // fallback simulación

    const data = await res.json ? await res.json() : { ok: true };
    if (data.ok) {
      state.isAdmin = true;
      closeAdminModal();
      render();
    } else {
      alert(data.error || 'Error de acceso');
    }
  }

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
    state.isAdmin = false;
    loadData();
  }

  loadData();
</script>

</body>
</html>
