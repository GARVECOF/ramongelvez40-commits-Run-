<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma con Barra de Retorno</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #0b1024; }
    /* Barra superior fija con el botón de retorno */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #121936;
      border-bottom: 1px solid #1f2947;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      z-index: 9999;
    }
    .btn-return {
      background: #46e0da;
      color: #0b1024;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    /* Contenedor donde carga la oferta o juego */
    #content-frame {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR FIJA QUE SIEMPRE VE EL USUARIO -->
  <div id="top-bar">
    <span style="color: #fff; font-size: 13px; font-weight: bold;">🎮 Zona de Juegos y Ofertas</span>
    <!-- Botón para regresar al panel principal de puntos -->
    <a href="https://ramongelvez40-commits-run.onrender.com" class="btn-return">⬅️ Volver a mi Panel</a>
  </div>

  <!-- MARCO DE LA PLATAFORMA -->
  <iframe id="content-frame" src="https://offerwall.me" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>

</body>
</html>
