<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-lib, initial-scale=1.0">
  <title>Panel de Usuario y Control</title>
  <style>
    :root {
      --cyan: #46e0da;
      --yellow: #ffd700;
      --muted: #8a99ad;
      --line: #1f2947;
    }
    body { background: #0b1024; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    .card { background: #121936; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    .hidden { display: none; }
    .btn { background: #1f2947; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }
    .btn.cyan { background: var(--cyan); color: #0b1024; }
    .input { width: 100%; padding: 10px; background: #0d132d; border: 1px solid var(--line); color: #fff; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .platform-item { background: #0d132d; border: 1px solid var(--line); border-radius: 10px; padding: 15px; text-align: center; }
  </style>
</head>
<body>

<div id="app">
  <!-- El contenido del usuario o admin se renderiza aquí -->
</div>

<!-- MODAL DE REGISTRO / AUTENTICACIÓN DE USUARIO -->
<div id="registerModal" class="card" style="max-width: 400px; margin: 40px auto;">
  <h3>📝 Registro de Usuario</h3>
  <p style="font-size: 12px; color: var(--muted);">Regístrate para guardar tus ganancias y aparecer en el panel de desarrollador.</p>
  <input type="text" id="regName" class="input" placeholder="Tu Nombre">
  <input type="email" id="regEmail" class="input" placeholder="Tu Correo Electrónico">
  <button class="btn cyan" onclick="registerUser()">Registrarse y Entrar</button>
</div>

<script>
  let state = { user: null, isAdmin: false, platforms: [], users: [], settings: {} };

  async function loadData() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();
      state = data;
      render();
    } catch (e) {
      // Modo local o interfaz estática base si el backend no responde directo
      renderUserInterface();
    }
  }

  function render() {
    if (state.isAdmin) {
      renderAdmin();
    } else if (!state.user) {
      document.getElementById('registerModal').classList.remove('hidden');
    } else {
      document.getElementById('registerModal').classList.add('hidden');
      renderUserInterface();
    }
  }

  function renderUserInterface() {
    const container = document.getElementById('app');
    container.innerHTML = `
      <div class="card">
        <h2>Panel de Usuario 🎮</h2>
        <p style="color: var(--muted); font-size: 13px;">Accede a tus plataformas disponibles desde aquí.</p>
        ${state.user ? `<p style="font-size: 12px; color: var(--cyan);">Usuario: ${state.user.name} | Monedas: ${state.user.coins || 0} 🪙</p>` : ''}
      </div>

      <!-- PLATAFORMAS / URLs -->
      <div class="card">
        <h3>Plataformas de la Aplicación</h3>
        <p style="font-size: 12px; color: var(--muted);">Selecciona una plataforma para abrir su enlace.</p>

        <div class="grid" style="margin-top: 15px;">
          ${state.platforms.length === 0 ? `
            <!-- Valores por defecto si la base de datos está vacía, asegurando las 5 URLs -->
            <div class="platform-item">
              <div style="font-size: 26px; margin-bottom: 8px;">🎮</div>
              <strong>App 1</strong>
              <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('https://ejemplo1.com')">Abrir URL 1</button>
            </div>
            <div class="platform-item">
              <div style="font-size: 26px; margin-bottom: 8px;">🚀</div>
              <strong>App 2</strong>
              <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('https://ejemplo2.com')">Abrir URL 2</button>
            </div>
            <div class="platform-item">
              <div style="font-size: 26px; margin-bottom: 8px;">💎</div>
              <strong>App 3</strong>
              <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('https://ejemplo3.com')">Abrir URL 3</button>
            </div>
            <div class="platform-item">
              <div style="font-size: 26px; margin-bottom: 8px;">🔥</div>
              <strong>App 4</strong>
              <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('https://ejemplo4.com')">Abrir URL 4</button>
            </div>
            <div class="platform-item">
              <div style="font-size: 26px; margin-bottom: 8px;">⭐</div>
              <strong>App 5</strong>
              <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('https://ejemplo5.com')">Abrir URL 5</button>
            </div>
          ` :
            state.platforms.map(p => `
              <div class="platform-item">
                <div style="font-size: 26px; margin-bottom: 8px;">${p.logo_url || '🎮'}</div>
                <strong>${p.name}</strong>
                <button class="btn cyan" style="display: block; margin-top: 10px; padding: 8px;" onclick="openPlatform('${p.link}')">Abrir URL</button>
              </div>
            `).join('')}
        </div>
      </div>
    `;
  }

  function openPlatform(link) {
    if (link) {
      window.open(link, '_blank');
    }
  }

  async function registerUser() {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    if (!name || !email) {
      alert('Por favor ingresa tu nombre y correo.');
      return;
    }
   
    // Envía los datos al backend para que el usuario aparezca en tu panel de control de desarrollador
    const res = await fetch('/api/user/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email })
    }).catch(() => null);

    state.user = { name, email, coins: 0 };
    document.getElementById('registerModal').classList.add('hidden');
    renderUserInterface();
    alert('¡Registro exitoso! Ya estás conectado al panel de control.');
  }

  function renderAdmin() {
    const container = document.getElementById('app');
    container.innerHTML = `
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Panel de Control Desarrollador ⚙️</h2>
          <button class="btn" style="width: auto;" onclick="logout()">Cerrar Sesión</button>
        </div>
        <p style="color: var(--muted); font-size: 13px; margin-top: 5px;">Aquí visualizas los usuarios registrados, sus correos y monedas para realizar los pagos.</p>
      </div>

      <!-- LISTADO DE USUARIOS REGISTRADOS EN TU PANEL -->
      <div class="card">
        <h3>Usuarios Registrados (Control de Pagos)</h3>
        <div style="margin-top: 15px; background: #0d132d; padding: 10px; border-radius: 8px;">
          ${state.users && state.users.length > 0 ? state.users.map(u => `
            <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line);">
              <div>
                <strong>${u.name}</strong><br>
                <span style="font-size: 11px; color: var(--muted);">${u.email}</span>
              </div>
              <div style="text-align: right;">
                <span style="color: var(--cyan); font-weight: bold;">${u.coins} 🪙</span><br>
                <button class="btn cyan" style="font-size: 10px; padding: 4px 8px; margin-top: 4px;" onclick="payUser('${u.email}')">Pagar Pin</button>
              </div>
            </div>
          `).join('') : '<p style="color: var(--muted); font-size: 12px;">No hay usuarios registrados todavía.</p>'}
        </div>
      </div>

      <!-- GESTIÓN DE LAS 5 PLATAFORMAS -->
      <div class="card">
        <h3>Gestionar las 5 URLs de Plataformas</h3>
        ${state.platforms.map(p => `
          <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #0d132d; padding: 8px; border-radius: 10px; flex-wrap: wrap;">
            <span style="font-weight: bold; color: var(--cyan);">#${p.slot}</span>
            <input type="text" id="p_name_${p.slot}" class="input" value="${p.name}" placeholder="Nombre" style="flex:1; margin:0; min-width: 100px;">
            <input type="text" id="p_logo_${p.slot}" class="input" value="${p.logo_url}" placeholder="Emoji" style="width: 60px; margin:0;">
            <input type="text" id="p_link_${p.slot}" class="input" value="${p.link}" placeholder="URL" style="flex:2; margin:0; min-width: 120px;">
            <button class="btn cyan" style="width: auto; padding: 6px 10px;" onclick="savePlatform(${p.slot})">Guardar</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function logout() {
    state.isAdmin = false;
    state.user = null;
    loadData();
  }

  loadData();
</script>

</body>
</html>
