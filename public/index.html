<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lu diamanst - Ruleta Pro</title>
  <style>
    :root { --bg: #0b1024; --panel: #141c3f; --text: #ffffff; --muted: #94a3b8; --purple: #7c3aed; --cyan: #06b6d4; --yellow: #f59e0b; --line: rgba(255,255,255,0.1); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #090d1f 0%, #151b3b 100%); font-family: 'Inter', system-ui, sans-serif; color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 15px; padding-bottom: 60px; }
    .shell { width: min(100%, 500px); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .btn { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: 0; padding: 14px 20px; border-radius: 14px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; transition: 0.2s; box-shadow: 0 4px 12px rgba(124,58,237,0.4); }
    .btn:hover { opacity: 0.95; transform: translateY(-2px); }
    .btn.cyan { background: linear-gradient(135deg, #06b6d4, #0284c7); box-shadow: 0 4px 12px rgba(6,182,212,0.4); color: #0b1024; }
    .input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--line); background: #080c1d; color: var(--text); font-size: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .coins-badge { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); padding: 8px 16px; border-radius: 50px; font-weight: bold; color: var(--yellow); display: flex; align-items: center; gap: 6px; }
   
    /* Ruleta Visualmente Atractiva */
    .wheel-box { display: flex; flex-direction: column; align-items: center; position: relative; margin: 15px 0; }
    .wheel-wrapper { position: relative; width: 300px; height: 300px; }
    .wheel-pointer { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #ef4444; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); z-index: 30; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); }
    .wheel-outer { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fbbf24; box-shadow: 0 0 30px rgba(251,191,36,0.3); overflow: hidden; position: relative; background: #080c1d; }
    .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1); }
   
    /* Segmentos de la Ruleta */
    .slice { position: absolute; width: 50%; height: 50%; top: 50%; left: 50%; transform-origin: 0% 0%; display: flex; align-items: center; justify-content: flex-end; padding-right: 30px; font-weight: 800; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
   
    .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75px; height: 75px; border-radius: 50%; background: linear-gradient(135deg, #fbbf24, #d97706); color: #0b1024; border: 4px solid #fff; font-weight: 900; font-size: 13px; cursor: pointer; z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: grid; place-items: center; }
    .wheel-center:hover { transform: translate(-50%, -50%) scale(1.05); }

    .hidden { display: none !important; }
    .gear { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div>
      <h2 style="margin:0;">💎 Lu diamanst</h2>
      <small style="color: var(--muted);">Ruleta de Recompensas</small>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="coins-badge" id="userCoinsHeader">🪙 0</div>
      <button class="gear" onclick="toggleAdmin()">⚙️</button>
    </div>
  </div>

  <div id="appView"></div>
</div>

<script>
  // Datos locales de ejemplo para que veas los premios bonitos de inmediato
  let userCoins = 1250;
  let currentDegree = 0;
  let isAdminOpen = false;

  // Premios definidos con colores llamativos, texto y emojis claros
  let wheelPrizes = [
    { label: '5 🪙', color: '#06b6d4', coins: 5 },
    { label: '🎁 Cofre', color: '#7c3aed', coins: 15 },
    { label: '10 🪙', color: '#f59e0b', coins: 10 },
    { label: '20 🪙', color: '#ef4444', coins: 20 },
    { label: '🎁 Bonus', color: '#10b981', coins: 25 },
    { label: '2 🪙', color: '#6366f1', coins: 2 }
  ];

  function renderApp() {
    const app = document.getElementById('appView');
    document.getElementById('userCoinsHeader').innerText = `🪙 ${userCoins}`;

    if (isAdminOpen) {
      app.innerHTML = `
        <div class="card">
          <h3>Panel de Configuración ⚙️</h3>
          <p style="font-size: 13px; color: var(--muted);">Modifica los premios de la ruleta fácilmente:</p>
          ${wheelPrizes.map((p, i) => `
            <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: center;">
              <span style="font-size: 12px; width: 30px;">#${i+1}</span>
              <input type="text" id="label_${i}" class="input" value="${p.label}" style="margin:0; flex:2;">
              <input type="number" id="coins_${i}" class="input" value="${p.coins}" style="margin:0; flex:1;" placeholder="Monedas">
              <input type="color" id="color_${i}" value="${p.color}" style="width: 40px; height: 40px; border:0; background:none; cursor:pointer;">
            </div>
          `).join('')}
          <button class="btn cyan" style="margin-top: 10px;" onclick="saveWheelConfig()">Guardar Cambios</button>
          <button class="btn" style="background: transparent; margin-top: 8px;" onclick="toggleAdmin()">Volver a la Ruleta</button>
        </div>
      `;
      return;
    }

    app.innerHTML = `
      <div class="card" style="text-align: center;">
        <h3 style="margin-top: 0;">🎡 ¡Gira y Gana!</h3>
        <p style="font-size: 13px; color: var(--muted); margin-bottom: 10px;">Presiona el centro para girar la ruleta y llevarte tus monedas.</p>
       
        <div class="wheel-box">
          <div class="wheel-pointer"></div>
          <div class="wheel-wrapper">
            <div class="wheel-outer">
              <div id="wheelElem" class="wheel"></div>
            </div>
            <button class="wheel-center" onclick="spinWheel()">GIRAR</button>
          </div>
        </div>
       
        <p id="resultMsg" style="font-size: 14px; font-weight: bold; color: var(--yellow); min-height: 20px; margin-top: 15px;"></p>
      </div>

      <div class="card" style="text-align: center; background: rgba(6,182,212,0.05); border-color: rgba(6,182,212,0.2);">
        <h4 style="margin: 0 0 8px 0; color: var(--cyan);">💡 ¿Cómo funciona?</h4>
        <p style="font-size: 12px; color: var(--muted); margin: 0;">Cada giro te otorga el premio exacto que marca la sección seleccionada en la rueda de la fortuna.</p>
      </div>
    `;

    setTimeout(buildWheelGraphics, 50);
  }

  // Dibuja matemáticamente los cortes de la ruleta con sus textos y colores visibles
  function buildWheelGraphics() {
    const wheel = document.getElementById('wheelElem');
    if (!wheel) return;
   
    let html = '';
    const total = wheelPrizes.length;
    const sliceAngle = 360 / total;

    wheelPrizes.forEach((p, index) => {
      const angle = index * sliceAngle;
      // El truco CSS de skewY permite formar porciones de torta perfectas
      html += `
        <div class="slice" style="background: ${p.color}; transform: rotate(${angle}deg) skewY(${90 - sliceAngle}deg);">
          <span style="transform: skewY(${-(90 - sliceAngle)}deg) rotate(${sliceAngle / 2}deg); position: absolute; right: 22px; color: #fff;">${p.label}</span>
        </div>
      `;
    });
    wheel.innerHTML = html;
  }

  function spinWheel() {
    const wheel = document.getElementById('wheelElem');
    const msg = document.getElementById('resultMsg');
    msg.innerText = "Girando ruleta...";

    // Seleccionar un premio aleatorio
    const randomIndex = Math.floor(Math.random() * wheelPrizes.length);
    const prize = wheelPrizes[randomIndex];

    // Calcular grados de giro (vueltas completas + la porción exacta)
    const sliceAngle = 360 / wheelPrizes.length;
    const extraRotations = 360 * 5; // 5 vueltas completas
    const targetDegree = currentDegree + extraRotations + (360 - (randomIndex * sliceAngle + sliceAngle / 2));
   
    currentDegree = targetDegree;
    wheel.style.transform = `rotate(${currentDegree}deg)`;

    setTimeout(() => {
      userCoins += prize.coins;
      document.getElementById('userCoinsHeader').innerText = `🪙 ${userCoins}`;
      msg.innerText = `🎉 ¡Ganaste ${prize.label}! (+${prize.coins} monedas)`;
    }, 4000);
  }

  function toggleAdmin() {
    isAdminOpen = !isAdminOpen;
    renderApp();
  }

  function saveWheelConfig() {
    for (let i = 0; i < wheelPrizes.length; i++) {
      wheelPrizes[i].label = document.getElementById(`label_${i}`).value;
      wheelPrizes[i].coins = Number(document.getElementById(`coins_${i}`).value);
      wheelPrizes[i].color = document.getElementById(`color_${i}`).value;
    }
    alert('¡Premios de la ruleta actualizados con éxito!');
    isAdminOpen = false;
    renderApp();
  }

  // Inicializar
  renderApp();
</script>

</body>
</html>
